name: Build Windows installer

# Runs on every push to main, on pull requests (build-only, for sanity
# checking), and manually via the "Run workflow" button on the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    # electron-builder needs to run on Windows to produce a Windows NSIS
    # installer without Wine.
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: kick-stream-overlay-installer
          path: dist/*.exe
          if-no-files-found: error
