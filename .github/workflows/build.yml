name: Build Windows exe

# Runs on every push to main (build-only, no public release), on any tag
# starting with "v" (build + create/update a public GitHub Release with the
# exe attached), or manually from the Actions tab.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Needed so the built-in token can create/update a Release in the "publish"
# step below - it can't do that with only the default read-only permission.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # npm ci requires a committed package-lock.json and fails hard
        # without one; npm install works either way, so it's used here
        # rather than assuming the lockfile is always present.
        run: npm install

      - name: Build installer
        run: npm run dist

      # electron-builder's nsis target writes the installer .exe into dist/
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kick-stream-overlay-windows
          path: dist/*.exe

      # Only runs for tag pushes (e.g. v1.0.6) - creates a public Release
      # named after the tag and attaches the exe, so anyone can download it
      # from the repo's Releases page without needing to be signed in.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
