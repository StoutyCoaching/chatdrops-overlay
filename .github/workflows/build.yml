name: Build Windows exe

# Runs whenever you push to main, or manually from the Actions tab
# ("Run workflow" button) if you just want a build without pushing.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist

      # electron-builder's nsis target writes the installer .exe into dist/
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kick-stream-overlay-windows
          path: dist/*.exe
